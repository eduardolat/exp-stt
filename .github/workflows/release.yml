name: Release Build

on:
  release:
    types: [created]
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ''
          # Linux ARM64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: ''
          # macOS AMD64 (Intel)
          - os: darwin
            arch: amd64
            runner: macos-13
            ext: ''
          # macOS ARM64 (Apple Silicon)
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
          # Windows AMD64
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: '.exe'
          # Windows ARM64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            ext: '.exe'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install urpc CLI
        shell: bash
        run: |
          URPC_VERSION="0.3.9"
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            linux-amd64)   URPC_BINARY="urpc-linux-amd64" ;;
            linux-arm64)   URPC_BINARY="urpc-linux-arm64" ;;
            darwin-amd64)  URPC_BINARY="urpc-darwin-amd64" ;;
            darwin-arm64)  URPC_BINARY="urpc-darwin-arm64" ;;
            windows-amd64) URPC_BINARY="urpc-windows-amd64.exe" ;;
            windows-arm64) URPC_BINARY="urpc-windows-arm64.exe" ;;
          esac

          URPC_URL="https://github.com/uforg/uforpc/releases/download/v${URPC_VERSION}/${URPC_BINARY}"
          echo "Downloading urpc from ${URPC_URL}..."

          if [[ "${{ matrix.os }}" == "windows" ]]; then
            curl -sSL "${URPC_URL}" -o urpc.exe
            chmod +x urpc.exe
            mv urpc.exe /c/Windows/System32/ || mv urpc.exe "${GITHUB_WORKSPACE}/"
            echo "${GITHUB_WORKSPACE}" >> $GITHUB_PATH
          else
            curl -sSL "${URPC_URL}" -o urpc
            chmod +x urpc
            sudo mv urpc /usr/local/bin/
          fi

          urpc --version

      # ============================================
      # Linux Dependencies
      # ============================================
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxfixes-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxinerama-dev \
            libxcomposite-dev \
            pkg-config

      # ============================================
      # Install webapp dependencies
      # ============================================
      - name: Install webapp dependencies
        shell: bash
        run: |
          cd webapp
          pnpm install --frozen-lockfile

      # ============================================
      # Run code generation
      # ============================================
      - name: Run codegen
        shell: bash
        run: task codegen

      # ============================================
      # Build binary
      # ============================================
      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          OUTPUT_NAME="tribar-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

          echo "Building ${OUTPUT_NAME}..."
          echo "GOOS=${GOOS} GOARCH=${GOARCH} CGO_ENABLED=${CGO_ENABLED}"

          go build -v -trimpath \
            -ldflags="-s -w -X github.com/varavelio/tribar/internal/config.AppVersion=${VERSION}" \
            -o "${OUTPUT_NAME}" \
            ./cmd/tribar

          echo "Build completed successfully!"
          ls -la "${OUTPUT_NAME}" || dir "${OUTPUT_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tribar-${{ matrix.os }}-${{ matrix.arch }}
          path: tribar-*${{ matrix.ext }}
          retention-days: 1

  # ============================================
  # Upload all binaries to the release
  # ============================================
  upload-release:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List all files
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -type f || ls -laR ./artifacts

      - name: Generate checksums
        run: |
          cd ./artifacts
          sha256sum tribar-* > checksums.txt || shasum -a 256 tribar-* > checksums.txt
          cat checksums.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/tribar-*
            ./artifacts/checksums.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
