# Available runners:
#
# https://github.com/actions/runner-images
# https://github.blog/changelog/2025-04-14-windows-arm64-hosted-runners-now-available-in-public-preview/
# https://github.blog/changelog/2024-06-24-github-actions-ubuntu-24-04-image-now-available-for-arm64-runners/

name: Release Build

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.24'

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            ext: ''
          # Linux ARM64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: ''
          # macOS AMD64 (Intel)
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            ext: ''
          # macOS ARM64 (Apple Silicon)
          - os: darwin
            arch: arm64
            runner: macos-15
            ext: ''
          # Windows AMD64
          - os: windows
            arch: amd64
            runner: windows-2025
            ext: '.exe'
          # Windows ARM64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            ext: '.exe'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ============================================
      # Linux Dependencies
      # ============================================
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxfixes-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxinerama-dev \
            libxcomposite-dev \
            pkg-config

      # ============================================
      # macOS - No extra dependencies needed
      # Xcode Command Line Tools are pre-installed
      # ============================================

      # ============================================
      # Windows Dependencies - No extra needed
      # MinGW is pre-installed on Windows runners
      # ============================================

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          OUTPUT_NAME="tribar-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

          echo "Building ${OUTPUT_NAME}..."
          echo "GOOS=${GOOS} GOARCH=${GOARCH} CGO_ENABLED=${CGO_ENABLED}"

          go build -v -trimpath \
            -ldflags="-s -w -X github.com/varavelio/tribar/internal/config.AppVersion=${VERSION}" \
            -o "${OUTPUT_NAME}" \
            ./cmd/tribar

          echo "Build completed successfully!"
          ls -la "${OUTPUT_NAME}" || dir "${OUTPUT_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tribar-${{ matrix.os }}-${{ matrix.arch }}
          path: tribar-*${{ matrix.ext }}
          retention-days: 1

  # ============================================
  # Upload all binaries to the release
  # ============================================
  upload-release:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List all files
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -type f || ls -laR ./artifacts

      - name: Generate checksums
        run: |
          cd ./artifacts
          sha256sum tribar-* > checksums.txt || shasum -a 256 tribar-* > checksums.txt
          cat checksums.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/tribar-*
            ./artifacts/checksums.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
